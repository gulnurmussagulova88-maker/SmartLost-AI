r input,.toolbar select{margin:0}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.detail-image{display:flex;align-items:center;justify-content:center;min-height:520px}.detail-image img{max-width:100%;max-height:620px;border-radius:12px}.detail-info h1{font-size:34px;margin:13px 0}.lead{color:var(--muted);line-height:1.6}.meta-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}.meta-list div{background:#f7f9fc;border-radius:12px;padding:12px}.meta-list dt{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}.meta-list dd{margin:5px 0 0;font-weight:700}.danger-zone{margin-top:20px;color:var(--red)}.single-form{max-width:760px}.dashboard-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.bar-row{display:grid;grid-template-columns:145px 1fr 30px;gap:10px;align-items:center;margin:13px 0;font-size:13px}.bar-track{height:11px;background:#edf0f5;border-radius:999px;overflow:hidden}.bar-fill{height:100%;background:var(--blue);border-radius:999px}.bar-fill.alt{background:var(--cyan)}.experiment-form{display:grid;grid-template-columns:1fr 1.3fr 1fr 1fr 1.3fr auto;gap:9px;align-items:end}.experiment-form input{margin:0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}.empty-state{grid-column:1/-1;padding:40px;text-align:center;color:var(--muted);background:white;border:1px dashed var(--border);border-radius:16px}.empty-state.large{padding:90px 20px}.flash{padding:13px 15px;background:#edf8f2;border:1px solid #bfe3cf;border-radius:12px;margin-bottom:18px;color:#176b49}footer{text-align:center;padding:28px;color:var(--muted);font-size:12px}

<script>
const CATS=["Кеңсе заты","Кітап/дәптер","Киім","Су бөтелкесі/ыдыс","Сөмке","Электроника","Спорт заты","Басқа"],

RET="Иесіне қайтарылды",FOUND="Табылды",$=s=>document.querySelector(s),

now=()=>new Date().toISOString().slice(0,19),today=()=>new Date().toLocaleDateString("sv"),
opts=(l,s,f)=>(f!=null?`<option value="">${f}</option>`:"")+l.map(x=>`<option ${x===s?"selected":""}>${esc(x)}</option>`).join("");
let D={items:[],exps:[],seq:1},A=null,FI={q:"",category:"",status:"all"};
/* ---------- Supabase (ортақ база) ---------- */
const SB_URL="https://qlisobvzopwzhihiqezw.supabase.co",SB_KEY="sb_publishable_BDP6UlEUdCzSfTdX0G2Hfw__3EbgOqs",H=SB_KEY.startsWith("sb_")?{apikey:SB_KEY}:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY};
async function api(path,o={}){const r=await fetch(SB_URL+"/rest/v1/"+path,{...o,headers:{...H,"Content-Type":"application/json",Prefer:"return=minimal",...(o.headers||{})}});const t=await r.text();if(!r.ok)throw new Error(t);return t?JSON.parse(t):null}
async function load(q){try{const[i,e]=await Promise.all([api("items?select=*&order=id.asc"),api("experiments?select=*&order=id.asc")]);i.forEach(x=>{x.image=x.image_url;x.quality=x.quality||{}});D={items:i,exps:e};return true}catch(x){if(!q)flash("Серверге қосылу мүмкін болмады: "+x.message);return false}}
function flash(m){const d=document.createElement("div");d.className="flash";d.textContent=m;$("#app").prepend(d);setTimeout(()=>d.remove(),6000)}
/* ---------- AI engine (port of ai_engine.py) ---------- */
const loadImg=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=()=>no();i.src=u});
function px(img,w,h,sx=0,sy=0,sw=img.naturalWidth,sh=img.naturalHeight){const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d",{willReadFrequently:true});x.imageSmoothingQuality="high";x.drawImage(img,sx,sy,sw,sh,0,0,w,h);return x.getImageData(0,0,w,h).data}
const hist=(v,b)=>{const h=Array(b).fill(0),s=256/b;for(const x of v)h[Math.min(b-1,x/s|0)]++;return h.map(x=>x/Math.max(v.length,1))},
stat=a=>{const n=a.length,m=a.reduce((x,y)=>x+y,0)/n;return[m,Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/n)]};
function hsv(r,g,b){const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){h=mx==r?((g-b)/d)%6:mx==g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360}return[h/360*255,mx?d/mx*255:0,mx]}
function edge(g,w,h){const o=new Array(w*h).fill(0);for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){let s=9*g[y*w+x];for(let j=-1;j<2;j++)for(let i=-1;i<2;i++)s-=g[(y+j)*w+x+i];o[y*w+x]=Math.max(0,Math.min(255,s))}return o}
function gray(img,n){const d=px(img,n,n),g=[];for(let i=0;i<n*n;i++)g.push(.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2]);return g}
function feats(img){const d=px(img,96,96),c=[[],[],[]],H=[],S=[],V=[],g=[];
for(let i=0;i<9216;i++){const r=d[i*4],gg=d[i*4+1],b=d[i*4+2];c[0].push(r);c[1].push(gg);c[2].push(b);const[h,s,v]=hsv(r,gg,b);H.push(h);S.push(s);V.push(v);g.push(.299*r+.587*gg+.114*b)}
const[em,es]=stat(edge(g,96,96)),[bm,bs]=stat(g),t=[];
for(let y=0;y<16;y++)for(let x=0;x<16;x++){let s=0;for(let j=0;j<6;j++)for(let i=0;i<6;i++)s+=g[(y*6+j)*96+x*6+i];t.push(s/36/255)}
return[...hist(c[0],8),...hist(c[1],8),...hist(c[2],8),...hist(H,12),...hist(S,4),...hist(V,4),...t,em/255,es/128,bm/255,bs/128,Math.min(img.naturalWidth/Math.max(img.naturalHeight,1),4)/4]}
function cos(a,b){if(!a||!b||a.length!==b.length)return 0;let d=0,x=0,y=0;for(let i=0;i<a.length;i++){d+=a[i]*b[i];x+=a[i]*a[i];y+=b[i]*b[i]}return x&&y?Math.max(0,Math.min(1,d/Math.sqrt(x*y))):0}
function domColor(img){const d=px(img,120,120),c={};for(let y=12;y<108;y++)for(let x=12;x<108;x++){const i=(y*120+x)*4,k=[d[i],d[i+1],d[i+2]].map(v=>(v>>5)*32+16).join();c[k]=(c[k]||0)+1}
const r=Object.entries(c).sort((a,b)=>b[1]-a[1]).map(e=>e[0].split(",").map(Number));let ch=r[0];
for(const q of r)if(!(Math.min(...q)>238&&Math.max(...q)-Math.min(...q)<12)){ch=q;break}
const wd=(a,b)=>{const m=(a[0]+b[0])/2,dr=a[0]-b[0],dg=a[1]-b[1],db=a[2]-b[2];return(2+m/256)*dr*dr+4*dg*dg+(2+(255-m)/256)*db*db};
return Object.keys(PAL).reduce((p,n)=>wd(ch,PAL[n])<wd(ch,PAL[p])?n:p)}
function quality(img){const g=gray(img,160),[br,ct]=stat(g),sh=stat(edge(g,160,160))[1];let s=100;const w=[];
if(br<45){s-=25;w.push("Сурет қараңғы")}else if(br>225){s-=20;w.push("Сурет тым жарық")}
if(ct<22){s-=20;w.push("Контраст төмен")}if(sh<18){s-=30;w.push("Сурет анық емес")}
if(Math.min(img.naturalWidth,img.naturalHeight)<300){s-=10;w.push("Ажыратымдылық төмен")}
return{score:Math.round(Math.max(0,s)*10)/10,brightness:+br.toFixed(1),contrast:+ct.toFixed(1),sharpness:+sh.toFixed(1),warnings:w}}
function predict(f,k=7){const tr=D.items.filter(i=>i.features&&i.category!=="Басқа");
if(!tr.length)return{category:"Басқа",confidence:0,training_count:0,neighbors:[]};
const sc=tr.map(i=>[cos(f,i.features),i.category,i.id]).sort((a,b)=>b[0]-a[0]).slice(0,k),votes={},best={};
for(const[s,c]of sc){votes[c]=(votes[c]||0)+Math.max(s-.45,0)**4;best[c]=Math.max(best[c]||0,s)}
const tot=Object.values(votes).reduce((a,b)=>a+b,0);
if(!tot)return{category:"Басқа",confidence:0,training_count:tr.length,neighbors:[]};
const p=Object.keys(votes).reduce((a,b)=>votes[a]>=votes[b]?a:b),
cf=Math.max(1,Math.min(99,Math.round(100*(.5*best[p]+.35*votes[p]/tot+.15*Math.min(1,tr.length/12)))));
return{category:p,confidence:cf,training_count:tr.length,neighbors:sc.slice(0,3).map(([s,c,id])=>({similarity:+(s*100).toFixed(1),category:c,item_id:id}))}}
async function analyze(file){const img=await loadImg(file),f=feats(img);return{img,features:f,color:domColor(img),quality:quality(img),...predict(f)}}
function thumb(img){const m=800,s=Math.min(1,m/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return new Promise(ok=>c.toBlob(ok,"image/jpeg",.82))}
function matchScore(sf,it,F){let sc=0;const bd=[];let sim=null;
if(sf&&it.features){sim=cos(sf,it.features);sc+=sim*65;bd.push(["Фото",+(sim*65).toFixed(1),65])}
for(const[k,db,l,p]of[["category","category","Санат",12],["color","color","Түс",8],["location","location","Орын",10],["date","found_date","Күн",5]])
if(F[k]){const g=it[db]===F[k]?p:0;sc+=g;bd.push([l,g,p])}
if(F.query){const g=(it.title+" "+(it.description||"")).toLowerCase().includes(F.query.toLowerCase())?5:0;sc+=g;bd.push(["Мәтін",g,5])}
return{score:+Math.min(100,sc).toFixed(1),visual:sim!=null?+(sim*100).toFixed(1):null,breakdown:bd}}

const V={

return head("04 • ЗЕРТТЕУ","Статистика және ғылыми эксперимент","Жүйе жұмысы мен зерттеу нәтижелерін сандық көрсеткіштермен бақылаңыз.")+`<section class="stats-grid stats-five">${[[t,"зат"],[a,"AI фото"],[rr+"%","қайтарылды"],[su+"%","уақыт үнемі"],[aq,"орташа фото сапасы"]].map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")}</section><div class="dashboard-grid"><section class="panel"><h2>Санаттар</h2>${bars(grp("category"),"")}</section><section class="panel"><h2>Табылған орындар</h2>${bars(grp("location"),"alt")}</section></div>

function csv(k){const q=s=>`"${String(s??"").replace(/"/g,'""')}"`,rows=k=="items"?[["id","title","category","color","location","found_date","status","ai_category","ai_confidence","quality_score"],...D.items.map(r=>[r.id,r.title,r.category,r.color,r.location,r.found_date,r.status,r.ai_category,r.ai_confidence,r.quality_score])]:[["id","participant_code","item_name","manual_time","smart_time","saved_seconds","notes","created_at"],...D.exps.map(r=>[r.id,r.participant_code,r.item_name,r.manual_time,r.smart_time,+(r.manual_time-r.smart_time).toFixed(1),r.notes,r.created_at])];

async function del(id){if(!confirm("Бұл жазбаны өшіруге сенімдісіз бе?"))return;const i=D.items.find(x=>x.id==id);try{await api("items?id=eq."+id,{method:"DELETE"});if(i&&i.image_url)fetch(SB_URL+"/storage/v1/object/items/"+i.image_url.split("/").pop(),{method:"DELETE",headers:H}).catch(()=>{});await load(true)}catch(x){return flash("Қате: "+x.message)}location.hash="#/items"}
function listItems(){const F=FI,qq=F.q.toLowerCase(),r=[...D.items].reverse().filter(i=>(F.status=="all"||(F.status=="returned")==(i.status===RET))&&(!F.category||i.category==F.category)&&(!qq||(i.title+" "+i.description).toLowerCase().includes(qq)));

$("#f").onsubmit=async e=>{e.preventDefault();const f=e.target;if(!A)return flash("Алдымен заттың суретін жүктеңіз.");
let c=f.category.value||A.category,cl=f.color.value||A.color,t=f.title.value.trim();if(!CATS.includes(c))c="Басқа";if(!COLS.includes(cl))cl="Басқа";if(!t)t=c!=="Басқа"?`${cl} ${c.toLowerCase()}`:"Табылған зат";

if(p=="search")$("#sf").onsubmit=async e=>{e.preventDefault();const f=e.target,F={query:f.query.value.trim(),category:f.category.value,color:f.color.value,location:f.location.value,date:f.date.value};let sf=null;const ph=$("#sp").files[0];
